{% extends "base.html" %}
{% set title = "Contact" %}
{% block content %}
<p class="kicker">Contact</p>
<h1>Let's talk 📬</h1>
<p class="lead">Drones, embedded Linux, firmware, or just football: send me a message and I'll get back to you.</p>

<div class="grid grid-2" style="margin-top: 1.5rem;">
    <section class="card">
        <h3>Send me a message</h3>
        <div id="form-notice"></div>
        <!-- Static site: the form is delivered by FormSubmit (formsubmit.co) -->
        <form id="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required autocomplete="name">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
            <!-- Spam trap: humans leave it empty -->
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
            <button class="btn" type="submit" id="send">Send message</button>
        </form>
    </section>

    <section class="card">
        <h3>Find me</h3>
        <p>
            <i class="fas fa-envelope"></i> <a href="mailto:bbzorba@hotmail.com">bbzorba@hotmail.com</a><br>
            <i class="fas fa-map-marker-alt"></i> Munich, Germany
        </p>
        <p style="font-size: 1.8rem;">
            <a href="https://www.linkedin.com/in/bbzorba/" title="LinkedIn" target="_blank"><i class="fab fa-linkedin"></i></a>&nbsp;
            <a href="https://github.com/bbzorba" title="GitHub" target="_blank"><i class="fab fa-github"></i></a>&nbsp;
            <a href="https://www.instagram.com/bbzorba/" title="Instagram" target="_blank"><i class="fab fa-instagram"></i></a>
        </p>
        <iframe
            title="Munich, Germany"
            src="https://www.google.com/maps?q=Munich,Germany&z=11&output=embed"
            style="border:0; width:100%; height:260px; border-radius: 10px;"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
</div>

<script>
(function () {
    var form = document.getElementById('contact-form');
    var notice = document.getElementById('form-notice');
    var button = document.getElementById('send');

    function show(kind, html) {
        notice.className = 'notice ' + kind;
        notice.innerHTML = html;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var field = function (n) { return form.elements.namedItem(n).value; };
        var data = {
            name: field('name'),
            email: field('email'),
            message: field('message'),
            _honey: field('_honey'),
            _subject: 'Website message from ' + field('name'),
            _replyto: field('email')
        };
        button.disabled = true;
        button.textContent = 'Sending…';

        fetch('https://formsubmit.co/ajax/bbzorba@hotmail.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(data)
        }).then(function (r) { return r.json(); }).then(function (res) {
            if (String(res.success) !== 'true') { throw new Error(res.message || 'not sent'); }
            show('ok', 'Thank you! Your message has been sent.');
            form.reset();
        }).catch(function () {
            var mail = 'mailto:bbzorba@hotmail.com?subject=' + encodeURIComponent(data._subject) +
                '&body=' + encodeURIComponent(data.message + '\n\n' + data.name + ' <' + data.email + '>');
            show('err', 'Sorry, the message could not be sent right now. ' +
                '<a href="' + mail + '">Send it with your mail app instead</a>.');
        }).finally(function () {
            button.disabled = false;
            button.textContent = 'Send message';
        });
    });
})();
</script>
{% endblock %}
