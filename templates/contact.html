<h3>Send me a message</h3>
<!-- The site is static, so the form opens the visitor's mail app with the
     message filled in instead of sending it from a server -->
<form id="contact-form" style="max-width:400px;">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required style="width:100%;"><br>
    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email" required style="width:100%;"><br>
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="5" required style="width:100%;"></textarea><br>
    <button type="submit" style="margin-top:10px;">Send</button>
</form>
<script>
document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var val = function (id) { return document.getElementById(id).value; };
    var body = 'Name: ' + val('name') + '\nE-mail: ' + val('email') + '\n\n' + val('message');
    window.location.href = 'mailto:bbzorba@hotmail.com' +
        '?subject=' + encodeURIComponent('Contact Form Message from Website') +
        '&body=' + encodeURIComponent(body);
});
</script>
